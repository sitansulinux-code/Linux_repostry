<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: rgb(0, 255, 145);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
            width: 320px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .footer {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>

</head>

<body>

    <!-- Hi Sipu, Welcome to the India -->

    <div class="login-container">

        <h2>Login</h2>

        <form>

            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Please Enter Username" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Please Enter Password" required>

            <button type="submit">Login</button>

        </form>

        <div class="footer">
            Don't have an account? <a href="#">Sign Up</a>
        </div>

    </div>

</body>
</html>
